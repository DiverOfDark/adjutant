[workspace]
resolver = "3"
members = ["crates/adjutant-acp", "crates/adjutant-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/DiverOfDark/adjutant"
rust-version = "1.88"

[workspace.dependencies]
# ACP is pinned exactly: the spec and crate still change between versions.
# Bump deliberately and only touch crates/adjutant-acp when doing so.
agent-client-protocol = { version = "=3.5.0" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
